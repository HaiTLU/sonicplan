# Kiểm tra tự động cho mọi PR và mỗi lần gộp vào main: chạy kiểm thử và đóng gói thử Worker.
name: Kiem tra
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir .dung-thu
  tro-nang:
    # Kiểm tra trợ năng (WCAG 2.2 A, AA) bằng axe-core trên 13 trang, sáng và tối, máy tính và điện thoại.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - run: node scripts/kiem-tro-nang.mjs
