# Bấm tay, chỉ đọc: xem trên Mac mini một số tin đã tách việc thế nào, và máy chủ có gọi được Claude không.
# In ra: trạng thái các tin được nêu, việc sinh ra từ chúng, ghi chú tín hiệu AI, và các dòng lỗi AI gần nhất trong nhật ký máy chủ.
name: Kiem tach viec
on:
  workflow_dispatch:
    inputs:
      tin_ids:
        description: 'Mã tin, cách nhau bằng dấu phẩy (ví dụ 2359). Để trống thì chỉ xem tình trạng chung.'
        required: false
        default: ''
      tu_khoa:
        description: 'Từ khóa tìm trong nội dung tin 48 giờ qua (không dùng dấu nháy, %, _, ;). Để trống thì bỏ qua.'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  kiem:
    runs-on: [self-hosted, sonicplan-may]
    timeout-minutes: 5
    steps:
      - name: Doc trang thai
        env:
          SONICPLAN_DIR: ${{ vars.SONICPLAN_DIR }}
          TIN_IDS: ${{ inputs.tin_ids }}
          TU_KHOA: ${{ inputs.tu_khoa }}
        run: |
          set -uo pipefail
          if [ -n "$TIN_IDS" ] && ! [[ "$TIN_IDS" =~ ^[0-9]+(,[0-9]+){0,19}$ ]]; then echo "Mã tin không hợp lệ: $TIN_IDS" >&2; exit 1; fi
          if [ -n "$TU_KHOA" ] && [[ "$TU_KHOA" =~ [\'\"%_\;\\] ]]; then echo "Từ khóa không hợp lệ" >&2; exit 1; fi
          GOC="${SONICPLAN_DIR:-$HOME/sonicplan}"
          DB="$GOC/du-lieu/sonicplan.sqlite"
          echo "== Ban dang chay =="
          git -C "$GOC" log -1 --format='%h %ci %s'
          ps -axo pid,lstart,command | grep -a "[m]ay-chu/chay.js" || echo "Không thấy tiến trình máy chủ"
          echo "== 8 tin moi nhat =="
          sqlite3 -readonly -header -column "$DB" "SELECT id, nguon, nguoi_gui, nhom, substr(noi_dung,1,30) AS noi_dung, da_tach, tach_luc, tao_luc FROM tin_nhan ORDER BY id DESC LIMIT 8;"
          echo "== Tin theo trang thai tach =="
          sqlite3 -readonly -header -column "$DB" "SELECT da_tach, count(*) AS so, max(id) AS id_moi_nhat FROM tin_nhan GROUP BY da_tach;"
          echo "== O hoi y kien (cau_hoi_ai) =="
          sqlite3 -readonly -header -column "$DB" "SELECT trang_thai, loai, count(*) AS so, max(tao_luc) AS moi_nhat FROM cau_hoi_ai GROUP BY trang_thai, loai;" 2>&1
          sqlite3 -readonly -header -column "$DB" "SELECT id, loai, trang_thai, substr(cau_hoi,1,40) AS cau_hoi, tin_nhan_id, tao_luc FROM cau_hoi_ai ORDER BY id DESC LIMIT 8;" 2>&1
          echo "== Khau luong (chi khoa luong_*) =="
          sqlite3 -readonly -header -column "$DB" "SELECT khoa, gia_tri FROM cai_dat WHERE khoa LIKE 'luong\\_%' ESCAPE '\\';"
          echo "== Telegram da noi chua =="
          sqlite3 -readonly -header -column "$DB" "SELECT khoa, CASE WHEN gia_tri IS NULL OR gia_tri = '' THEN 'trong' ELSE 'co' END AS co_gia_tri FROM cai_dat WHERE khoa LIKE 'telegram%';"
          sqlite3 -readonly -header -column "$DB" "SELECT nguon, lan_cuoi, ghi_chu FROM tin_hieu WHERE nguon IN ('telegram', 'tach-viec', 'zalo');"
          echo "== Nhat ky may chu: loi o hoi / telegram =="
          grep -a "ô hỏi\|ô thêm việc\|Telegram" "$GOC/du-lieu/may-chu.log" 2>/dev/null | tail -8 || true
          echo "== 10 viec moi nhat =="
          sqlite3 -readonly -header -column "$DB" "SELECT id, substr(tieu_de,1,50) AS tieu_de, han_ngay, gio_hen, nhom, tin_nhan_id, tao_luc FROM viec ORDER BY id DESC LIMIT 10;"
          echo "== Nhat ky may chu: luot AI gan day =="
          grep -a "Token Claude Code\|Tách việc\|tách việc" "$GOC/du-lieu/may-chu.log" 2>/dev/null | tail -12 || true
          echo "== Tin 24h qua co tu khoa (tra sua, hoa, CPG, Bac Kim, Vu KHTC, Hung Anh) =="
          sqlite3 -readonly -header -column "$DB" "SELECT id, nguoi_gui, substr(nhom,1,20) AS nhom, substr(replace(noi_dung, char(10), ' '),1,50) AS noi_dung, da_tach, tao_luc FROM tin_nhan WHERE tao_luc > datetime('now', '-30 hours') AND (noi_dung LIKE '%sữa%' OR noi_dung LIKE '%hoa%' OR noi_dung LIKE '%CPG%' OR noi_dung LIKE '%KHTC%' OR noi_dung LIKE '%Hùng Anh%' OR noi_dung LIKE '%Bác Kim%') ORDER BY id;"
          if [ -n "$TU_KHOA" ]; then
            echo "== Tin 48h qua chua tu khoa: $TU_KHOA =="
            sqlite3 -readonly -header -column "$DB" "SELECT id, nguon, nguoi_gui, substr(nhom,1,20) AS nhom, substr(tieu_de,1,20) AS tieu_de, substr(replace(noi_dung, char(10), ' '),1,60) AS noi_dung, da_tach, an, tach_luc, tao_luc FROM tin_nhan WHERE tao_luc > datetime('now', '-48 hours') AND noi_dung LIKE '%$TU_KHOA%' ORDER BY id;"
            echo "== Viec sinh ra tu cac tin do =="
            sqlite3 -readonly -header -column "$DB" "SELECT id, tieu_de, han_ngay, gio_hen, trang_thai, tin_nhan_id, tao_luc FROM viec WHERE tin_nhan_id IN (SELECT id FROM tin_nhan WHERE tao_luc > datetime('now', '-48 hours') AND noi_dung LIKE '%$TU_KHOA%');"
          fi
          echo "== Tin =="
          sqlite3 -readonly -header -column "$DB" "SELECT id, nguoi_gui, substr(noi_dung,1,40) AS noi_dung, da_tach, tach_luc FROM tin_nhan WHERE id IN (${TIN_IDS:-0});"
          echo "== Viec sinh ra tu cac tin =="
          sqlite3 -readonly -header -column "$DB" "SELECT id, tieu_de, han_ngay, gio_hen, trang_thai, tin_nhan_id, lich_event_id IS NOT NULL AS len_lich, tao_luc FROM viec WHERE tin_nhan_id IN (${TIN_IDS:-0});"
          echo "== Tin hieu AI =="
          sqlite3 -readonly -header -column "$DB" "SELECT nguon, lan_cuoi, ghi_chu FROM tin_hieu WHERE nguon = 'ai';"
          echo "== Nhat ky may chu: loi AI gan day =="
          grep -a "Claude Code lỗi\|AI ngoài lỗi\|Tách việc lỗi\|Not logged in\|Workers AI" "$GOC/du-lieu/may-chu.log" 2>/dev/null | tail -8 || true
          echo "== Dang nhap Claude cua tai khoan chay may chu =="
          # Chỉ hỏi trạng thái, không gửi nội dung nào.
          "$HOME/.local/bin/claude" -p "ok" --tools "" --no-session-persistence --output-format json 2>&1 | tail -c 300 || true
