# Bấm tay, chỉ đọc: xem trên Mac mini một số tin đã tách việc thế nào, và máy chủ có gọi được Claude không.
# In ra: trạng thái các tin được nêu, việc sinh ra từ chúng, ghi chú tín hiệu AI, và các dòng lỗi AI gần nhất trong nhật ký máy chủ.
name: Kiem tach viec
on:
  workflow_dispatch:
    inputs:
      tin_ids:
        description: 'Mã tin, cách nhau bằng dấu phẩy (ví dụ 2359)'
        required: true
permissions:
  contents: read
jobs:
  kiem:
    runs-on: [self-hosted, sonicplan-may]
    timeout-minutes: 5
    steps:
      - name: Doc trang thai
        env:
          SONICPLAN_DIR: ${{ vars.SONICPLAN_DIR }}
          TIN_IDS: ${{ inputs.tin_ids }}
        run: |
          set -uo pipefail
          if ! [[ "$TIN_IDS" =~ ^[0-9]+(,[0-9]+){0,19}$ ]]; then echo "Mã tin không hợp lệ: $TIN_IDS" >&2; exit 1; fi
          GOC="${SONICPLAN_DIR:-$HOME/sonicplan}"
          DB="$GOC/du-lieu/sonicplan.sqlite"
          echo "== Tin =="
          sqlite3 -readonly -header -column "$DB" "SELECT id, nguoi_gui, substr(noi_dung,1,40) AS noi_dung, da_tach, tach_luc FROM tin_nhan WHERE id IN ($TIN_IDS);"
          echo "== Viec sinh ra tu cac tin =="
          sqlite3 -readonly -header -column "$DB" "SELECT id, tieu_de, han_ngay, gio_hen, trang_thai, tin_nhan_id, lich_event_id IS NOT NULL AS len_lich, tao_luc FROM viec WHERE tin_nhan_id IN ($TIN_IDS);"
          echo "== Tin hieu AI =="
          sqlite3 -readonly -header -column "$DB" "SELECT nguon, lan_cuoi, ghi_chu FROM tin_hieu WHERE nguon = 'ai';"
          echo "== Nhat ky may chu: loi AI gan day =="
          grep -a "Claude Code lỗi\|AI ngoài lỗi\|Tách việc lỗi\|Not logged in\|Workers AI" "$GOC/du-lieu/may-chu.log" 2>/dev/null | tail -8 || true
          echo "== Dang nhap Claude cua tai khoan chay may chu =="
          # Chỉ hỏi trạng thái, không gửi nội dung nào.
          "$HOME/.local/bin/claude" -p "ok" --tools "" --no-session-persistence --output-format json 2>&1 | tail -c 300 || true
