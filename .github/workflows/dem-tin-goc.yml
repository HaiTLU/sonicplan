# Chạy tay: đếm số việc bị mất tin gốc khỏi bối cảnh (cách lấy cũ: 40 tin sớm nhất trong cửa sổ 6 ngày) trên CSDL thật.
# Chỉ đọc (SQLite mode=ro), chỉ in ba con số, không in nội dung tin. Không chạy tự động.
name: Dem tin goc
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dem:
    runs-on: [self-hosted, sonicplan-may]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Dem
        env:
          SONICPLAN_DIR: ${{ vars.SONICPLAN_DIR }}
        run: python3 scripts/dem-tin-goc.py "${SONICPLAN_DIR:-$HOME/apps/sonicplan}/du-lieu/sonicplan.sqlite"
